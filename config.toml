# ── Detection ──────────────────────────────────────────────────────────────────
[detection]

# YOLOv8s vehicle detector confidence (car / motorcycle / bus / truck).
# Higher = rejects false vehicle boxes (bins, trees, signs) that would
# otherwise drag fake plates through the in-vehicle filter.
# Lower = catches more motorcycles (small / distant / leaning bikes).
vehicle_conf = 0.35

# Plate model — used only as a cache-header / CLI value. New detections
# search plates inside vehicle crops at plate_conf_in_vehicle.
plate_conf = 0.45

# Plate model — lower threshold applied only when a plate overlaps a detected
# vehicle bounding box. Set lower than plate_conf to catch blurry / angled /
# distant plates on vehicles.
plate_conf_in_vehicle = 0.15

# Lower YOLO confidence accepted for a motorcycle that fills the frame
# (the default vehicle_conf is often too high for a close bike).
moto_close_conf = 0.20

# After YOLO: drop motorcycle boxes below this. Stops bus corners / debris
# labelled motorcycle at 0.20–0.29. Cars/bus/truck still use
# moto_close_conf as the detector floor. Replay-safe (not in cache).
moto_min_conf = 0.30

# Detection scale / SAHI full-frame tiling were removed: the plate model
# only runs on vehicle crops. blur is always at full resolution.
[blur]

# Gaussian blur kernel size — must be odd; larger = stronger blur.
# Distant plates stay relatively light; the redaction code scales the kernel
# up with zone size so a close readable plate (2:35 adventure bike) washes out.
strength = 35

# Extra pixels added around each detected plate region.
# Higher = more generous coverage, catches fast oncoming vehicles.
padding = 10

# Maximum fraction of frame width/height a single blur box may cover.
# Prevents interpolated boxes from ballooning across the frame.
# Generous enough to leave room for the padding expansion.
max_box_frac = 0.25


# ── Interpolated blur zones ───────────────────────────────────────────────────
# After detections are cached, plates are kept only when they sit inside a
# vehicle box, chained into tracklets, and short plausible gaps are filled by
# interpolating plate pose relative to the vehicle. Cuts and teleports are
# not bridged. There is no online Kalman/EMA/ghost tracker.
[zones]

# Max consecutive missed frames to interpolate between two observations
# (~1.0 s at 30 fps). Longer gaps stay empty.
max_gap_frames = 30

# Motion gate: allowed travel ≈ max(max_disp_px, vehicle_diag * max_disp_frac)
# × gap_frames (plus a small margin inside the code).
max_disp_px = 80.0
max_disp_frac = 0.35

# Endpoints must share a vehicle box at least this IoU (same vehicle).
min_vehicle_iou = 0.15

# Ignore cached plates below this confidence when building tracklets.
conf_floor = 0.15

# Drop plates whose shorter side is below this (specks, not readable).
min_plate_side_px = 12.0

# When two plates sit on the same vehicle, keep the hit closest to that
# vehicle's last plate (a top-case blob is usually farther). Nested boxes
# keep the larger one. No history: keep the larger box. A later hit whose
# area is smaller than the vehicle's peak plate/vehicle ratio (not just the
# last frame) by more than this factor is a blob: skip it so interpolation
# covers the real plate. A receding bike is kept because
# plate and vehicle shrink together. Growth is kept.
max_area_ratio = 2.5

# YOLO may label a motorcycle as car/truck for a few frames. Hold the moto
# box and bridge plates across at most this many missing frames even if the
# vehicle boxes no longer overlap (still gated by travel distance).
max_class_flip_frames = 10

# Skip motorcycle observations whose vehicle box is smaller than this fraction
# of the frame height (plate already unreadable). ~90 px at 1080p.
# Compared to max(width, height) so a leaned bike is not treated as distant.
moto_min_blur_box_h_frac = 0.08333

# Schmitt trigger around that size. Stay large until size drops below
# exit_frac * threshold; become large only at or above enter_frac * threshold.
# Stops green/magenta flicker when YOLO alternates rider+bike vs rear-only.
moto_size_enter_frac = 1.15
moto_size_exit_frac = 0.85


# ── Frame preprocessing ───────────────────────────────────────────────────────
[preprocessing]

# Unsharp masking on the vehicle crop (not the full frame).
# NOTE: measured on the 38s leaned-moto case — sharpen on the FRAME
# DESTROYS small in-box plate detections. Keep OFF on the frame; CLAHE
# below is the crop-only contrast path.
sharpen        = false

# How strongly to amplify the sharpening:
#   0.5 = subtle boost    1.5 = strong (recommended starting point)
#   3.0 = aggressive (may introduce halos on high-contrast edges)
sharpen_amount = 2.0

# Gaussian radius used to compute the unsharp mask (pixels).
# 1.0 sharpens fine detail; increase to 2.0 to target coarser blur.
sharpen_sigma  = 1.0

# CLAHE on each vehicle crop (LAB lightness). Helps plates in tree shadow /
# low contrast without changing geometry. clip 2.0 is mild; 3–4 is stronger.
crop_clahe = true
crop_clahe_clip = 2.0
crop_clahe_grid = 8

# Vehicle crop canvas — square the plate model sees (letterbox, same aspect).
# 640 = old default. 1280 = larger tela so a ~600 px bike is not squeezed.
# Upscale onto this canvas is capped at vehicle_crop_scale / moto_crop_scale.
plate_crop_imgsz = 1280

# Max upscale of the vehicle box onto plate_crop_imgsz (aspect preserved).
# 2.0 = at most double; extra canvas is padding, not more zoom.
vehicle_crop_scale = 2.0

# Motorcycle extra pass — rear-box ROI at the same max upscale.
moto_crop_bottom_frac = 0.28   # ROI from this fraction of box height to bottom
moto_crop_scale = 2.0
moto_crop_side_pad_frac = 0.05


# ── Redaction style ───────────────────────────────────────────────────────────
# What gets drawn over each detected plate region (and the --own-plate region).
# Can be overridden on the CLI with --mode / --color / --image.
[redact]

# "blur"  → Gaussian blur (default, original behaviour)
# "color" → solid colour fill
# "image" → custom image stretched onto every plate
mode = "blur"

# Default fill colour for mode = "color"  (R,G,B, 0-255)
# CLI: --color 255,0,0
color = "0,0,0"

# Default overlay image path for mode = "image".  Leave blank to require --image.
# CLI: --image /path/to/sticker.png
# Supports PNG with alpha channel (the alpha is honoured during compositing).
image = ""


# ── Output / encoding ─────────────────────────────────────────────────────────
[output]

# libx265 preset for final HEVC encode (ultrafast / fast / medium / slow)
preset = "medium"

# Final HEVC quality — used as CRF on libx265 and as CQ on hevc_nvenc.
# Lower numbers = higher quality + larger files. Sensible range:
#   0  = truly lossless (HUGE files, often unplayable in non-pro players)
#   18 = visually lossless (default, ~5-15% the size of qp 0)
#   23 = near-broadcast quality, ~3-5× smaller
#   28 = noticeable compression, smallest reasonable size
quality = 18

# Directory for temporary lossless intermediate files (needs ~2x input size free).
# "auto" picks the OS temp dir at runtime (e.g. /tmp on Linux/macOS,
# %TEMP% on Windows). Set an explicit path to use a specific drive/location.
tmp_dir = "auto"
